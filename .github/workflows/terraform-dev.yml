name: terraform-dev

on:
  pull_request:
    paths:
      - "infra/envs/dev/**"
      - "infra/modules/**"
      - ".github/workflows/terraform-dev.yml"
  push:
    branches: [main]
    paths:
      - "infra/envs/dev/**"
      - "infra/modules/**"
      - ".github/workflows/terraform-dev.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: terraform-dev
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TF_VAR_alert_email: ${{ secrets.ALERT_EMAIL }}

defaults:
  run:
    working-directory: infra/envs/dev

jobs:
  plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.5
          terraform_wrapper: false

      - name: Assume read-only plan role via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_PLAN_ROLE_ARN }}
          role-session-name: gha-plan-${{ github.run_id }}
          aws-region: us-east-1

      - name: terraform init
        run: terraform init

      - name: terraform plan
        run: terraform plan -no-color | tee plan.txt

      - name: Publish plan to job summary
        if: always()
        run: |
          {
            echo "### terraform plan: dev"
            echo '```'
            tail -c 60000 plan.txt 2>/dev/null || echo "plan.txt not found"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  apply:
    needs: plan
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v5

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.5
          terraform_wrapper: false

      - name: Assume apply role via OIDC (dev environment only)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_APPLY_ROLE_ARN }}
          role-session-name: gha-apply-${{ github.run_id }}
          aws-region: us-east-1

      - name: terraform init
        run: terraform init

      - name: terraform plan
        run: terraform plan -no-color -out=tfplan

      - name: terraform apply
        run: terraform apply -no-color tfplan
